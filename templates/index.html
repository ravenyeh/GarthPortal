<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Auth Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Garmin Auth Portal</h1>
            <p class="subtitle">Garmin Connect Token (Support MFA)</p>
        </header>

        <!-- Login Form -->
        <div id="login-section" class="card">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <label for="domain">Domain</label>
                    <select id="domain" name="domain">
                        <option value="garmin.com">garmin.com (Global)</option>
                        <option value="garmin.cn">garmin.cn (China)</option>
                    </select>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary">Login</button>
            </form>
        </div>

        <!-- MFA Section -->
        <div id="mfa-section" class="card hidden">
            <h2>MFA Verification</h2>
            <p class="mfa-hint">Please enter the verification code from your authenticator app or SMS.</p>
            <form id="mfa-form">
                <div class="form-group">
                    <label for="mfa-code">Verification Code</label>
                    <input type="text" id="mfa-code" name="mfa_code"
                           placeholder="6-digit code" maxlength="7"
                           pattern="[0-9]*" inputmode="numeric" required autocomplete="one-time-code">
                </div>
                <button type="submit" id="mfa-btn" class="btn btn-primary">Verify</button>
                <button type="button" id="back-btn" class="btn btn-secondary">Back to Login</button>
            </form>
        </div>

        <!-- Token Result Section -->
        <div id="token-section" class="card hidden">
            <h2>Authentication Successful</h2>
            <div id="user-info" class="info-box"></div>

            <div class="token-group">
                <h3>OAuth1 Token</h3>
                <div class="token-field">
                    <label>Token</label>
                    <div class="token-value-row">
                        <input type="text" id="oauth1-token" readonly>
                        <button class="btn btn-copy" data-target="oauth1-token" title="Copy">Copy</button>
                    </div>
                </div>
                <div class="token-field">
                    <label>Token Secret</label>
                    <div class="token-value-row">
                        <input type="text" id="oauth1-secret" readonly>
                        <button class="btn btn-copy" data-target="oauth1-secret" title="Copy">Copy</button>
                    </div>
                </div>
            </div>

            <div class="token-group">
                <h3>OAuth2 Token</h3>
                <div class="token-field">
                    <label>Access Token</label>
                    <div class="token-value-row">
                        <textarea id="oauth2-access" readonly rows="3"></textarea>
                        <button class="btn btn-copy" data-target="oauth2-access" title="Copy">Copy</button>
                    </div>
                </div>
                <div class="token-field">
                    <label>Refresh Token</label>
                    <div class="token-value-row">
                        <textarea id="oauth2-refresh" readonly rows="3"></textarea>
                        <button class="btn btn-copy" data-target="oauth2-refresh" title="Copy">Copy</button>
                    </div>
                </div>
                <div class="token-field">
                    <label>Token Type</label>
                    <div class="token-value-row">
                        <input type="text" id="oauth2-type" readonly>
                        <button class="btn btn-copy" data-target="oauth2-type" title="Copy">Copy</button>
                    </div>
                </div>
                <div class="token-field">
                    <label>Expires At</label>
                    <div class="token-value-row">
                        <input type="text" id="oauth2-expires" readonly>
                        <button class="btn btn-copy" data-target="oauth2-expires" title="Copy">Copy</button>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="save-btn" class="btn btn-primary">Save Tokens</button>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <!-- Load Tokens Section -->
        <div id="load-section" class="card">
            <h2>Load Saved Tokens</h2>
            <p>If you have previously saved tokens, you can load them directly.</p>
            <button id="load-btn" class="btn btn-secondary">Load Tokens</button>
        </div>

        <!-- Status Messages -->
        <div id="status-bar" class="status-bar hidden"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
